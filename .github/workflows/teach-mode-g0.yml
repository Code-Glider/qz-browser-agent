name: Teach Mode G0 cloud verification

on:
  push:
    branches:
      - 'feature/teach-mode-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teach-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teach-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- unit --match teach
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm exec playwright install-deps chromium
      - run: npm test -- playwright teach-mode.spec.mjs --workers 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: teach-mode-g0-failure
          path: tests/results/playwright/
          retention-days: 7
